<!-- Reusable Bootstrap 5 Confirmation / Alert / Prompt Dialog Modal (R-027) -->
<div
    class="modal fade"
    id="fabtrackDialogModal"
    tabindex="-1"
    aria-labelledby="fabtrackDialogTitle"
    aria-describedby="fabtrackDialogMessage"
    aria-hidden="true"
    data-label-confirm="<%= typeof __ === 'function' ? __('common.confirm') : 'Confirmer' %>"
    data-label-cancel="<%= typeof __ === 'function' ? __('common.cancel') : 'Annuler' %>"
    data-label-close="<%= typeof __ === 'function' ? __('common.close') : 'Fermer' %>"
    data-label-warning="<%= typeof __ === 'function' ? __('common.warning') : 'Avertissement' %>"
    data-label-error="<%= typeof __ === 'function' ? __('common.error') : 'Erreur' %>"
    data-label-info="<%= typeof __ === 'function' ? __('common.info') : 'Information' %>"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title d-flex align-items-center gap-2" id="fabtrackDialogTitle">
                    <span id="fabtrackDialogIconWrap" class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-subtle text-warning" style="width: 2rem; height: 2rem;">
                        <i id="fabtrackDialogIcon" class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                    </span>
                    <span id="fabtrackDialogTitleText"><%= typeof __ === 'function' ? __('common.confirm') : 'Confirmer' %></span>
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="<%= typeof __ === 'function' ? __('common.close') : 'Fermer' %>"
                ></button>
            </div>
            <div class="modal-body">
                <p id="fabtrackDialogMessage" class="mb-0 text-body" style="white-space: pre-line;"></p>
                <div id="fabtrackDialogInputWrapper" class="mt-3 d-none">
                    <label for="fabtrackDialogInput" id="fabtrackDialogInputLabel" class="form-label small fw-semibold visually-hidden">Saisie</label>
                    <input type="text" class="form-control" id="fabtrackDialogInput" autocomplete="off" />
                </div>
            </div>
            <div class="modal-footer bg-body-tertiary">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="fabtrackDialogCancelBtn" data-bs-dismiss="modal">
                    <%= typeof __ === 'function' ? __('common.cancel') : 'Annuler' %>
                </button>
                <button type="button" class="btn btn-danger btn-sm fw-semibold" id="fabtrackDialogConfirmBtn">
                    <%= typeof __ === 'function' ? __('common.confirm') : 'Confirmer' %>
                </button>
            </div>
        </div>
    </div>
</div>
