<base href="<%= typeof baseUrl !== 'undefined' ? baseUrl : '/' %>" />
<script>
    window.__APP_BASE_PATH__ = "<%= typeof basePath !== 'undefined' && basePath ? basePath : '' %>" || (window.location.pathname.startsWith('/fabtrack') ? '/fabtrack' : '');
</script>

<script src="javascripts/color-mode-toggler.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment/2.29.4/moment.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3" />
<link rel="stylesheet" href="stylesheets/fontawsome-all.min.css" />
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
/>
<link rel="stylesheet" href="stylesheets/main.css" />
<% const favPath = typeof platformFaviconPath !== 'undefined' && platformFaviconPath ? platformFaviconPath : ''; %>
<% if (favPath) { %>
<link rel="icon" href="<%= favPath %>" />
<% } else { %>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=2" />
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon.png?v=2" />
<% } %>
